[package]
name = "zenith-sensor-worker"
version = "0.1.0"
description = "Zenith sensor worker - reads real CPU temperatures via PawnIO"
edition = "2021"
rust-version = "1.75"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
panic = "abort"
