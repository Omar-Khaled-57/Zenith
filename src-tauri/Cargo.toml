[package]
name = "zenith"
version = "1.0.0"
description = "System Health & Thermal Intelligence Monitor"
authors = ["Omar Khaled"]
edition = "2021"

[lib]
name = "zenith_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.38.4"

